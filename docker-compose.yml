# Production + local Docker setup.
#
#   bun run build            # local production build
#   docker compose up --build          # app + postgres (pgvector) + rag db
#   docker compose up -d db            # only the primary db (see `db:up` script)
#   docker compose run --rm app bunx --bun payload --disable-transpile migrate   # one-off migrate
#
# Runtime config comes from `.env` (see .env.example). DATABASE_URL and
# KNOWLEDGE_DATABASE_URL are constructed here so the app reaches the
# composed `db` / `rag-db` services by DNS name instead of localhost.
# To point the app at an external database, override them explicitly:
#   DATABASE_URL=postgres://... docker compose up app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: last-lst97-dev-web:latest
    depends_on:
      db:
        condition: service_healthy
      # Soft dependency: the app boots and serves traffic with RAG disabled
      # even if the knowledge db / embedding sidecar is down.
      rag-db:
        condition: service_started
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://postgres:${PAYLOAD_DB_PASSWORD:?Set PAYLOAD_DB_PASSWORD in .env}@db:5432/app
      KNOWLEDGE_DATABASE_URL: postgres://rag:${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}@rag-db:5432/rag
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # Set SKIP_MIGRATIONS=true on scaled replicas; keep it unset/false on
      # the primary so the entrypoint runs `payload migrate` before serving.
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    ports:
      # Loopback-only by default (same as the db services below).
      # Publish publicly via reverse proxy / tunnel instead of 0.0.0.0.
      # Remap with APP_PORT=... (e.g. when another stack owns 3000).
      - '${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/site/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PAYLOAD_DB_PASSWORD:?Set PAYLOAD_DB_PASSWORD in .env}"
      POSTGRES_DB: app
    ports:
      - '${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  rag-db:
    # Vector store for the knowledge/RAG index. Note: the local embedding
    # sidecar (`llama-server` + GGUF) is NOT containerized here — in Docker,
    # point KNOWLEDGE_EMBEDDING_URL at an external endpoint or keep
    # KNOWLEDGE_RAG_ENABLED=false. Container loopback has no model server.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}"
      POSTGRES_DB: rag
    ports:
      - '${RAG_DB_HOST:-127.0.0.1}:${RAG_DB_PORT:-5435}:5432'
    shm_size: 256mb
    volumes:
      - ragdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  ragdata:
