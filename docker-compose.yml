services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PAYLOAD_DB_PASSWORD:?Set PAYLOAD_DB_PASSWORD in .env}"
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
  rag-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}"
      POSTGRES_DB: rag
    ports:
      - '127.0.0.1:5435:5432'
    shm_size: 256mb
    volumes:
      - ragdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  ragdata:
